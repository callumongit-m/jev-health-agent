[project]
name = "health-agent"
version = "0.1.0"
description = "Health risk agent: Jev classification + LangGraph reasoning, fronted by MCP and A2A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
jev = ["langchain-typesafe", "typesafe-sdk"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
